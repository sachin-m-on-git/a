<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
</head>
<body style="background:#fff;margin:0;">
<script src="/links.js"></script>
<script>
const path = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ''));
const target = typeof findLinkByRoute === 'function' ? findLinkByRoute(path) : null;

if (target && target.url) {
  function exit() {
    window.close();
    try { window.open('', '_self', ''); window.close(); } catch(e){}
  }

  function copyExec(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch(e) {
      return false;
    }
  }

  async function copy() {
    copyExec(target.url);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(target.url);
      } catch(e) {}
    }
    exit();
  }

  copy();
  exit();
  window.addEventListener('click', () => { copy(); exit(); });
  window.addEventListener('keydown', () => { copy(); exit(); });
  window.addEventListener('touchstart', () => { copy(); exit(); });
}
</script>
</body>
</html>
