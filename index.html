<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
</head>
<body style="background:#fff;margin:0;min-height:100vh;cursor:pointer;">
<script src="/links.js"></script>
<script>
const path = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ''));
const target = typeof findLinkByRoute === 'function' ? findLinkByRoute(path) : null;

if (target && target.url) {
  function copyExec(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch(e) {
      return false;
    }
  }

  function exit() {
    window.close();
    try {
      window.open('', '_self', '');
      window.close();
    } catch(e){}
    try {
      window.location.replace('about:blank');
      window.close();
    } catch(e){}
  }

  function run() {
    copyExec(target.url);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(target.url).then(exit).catch(exit);
    }
    exit();
  }

  run();
  window.addEventListener('click', run);
  window.addEventListener('keydown', run);
  window.addEventListener('touchstart', run);
}
</script>
</body>
</html>
