<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
</head>
<body style="background:#fff;margin:0;min-height:100vh;cursor:pointer;">
<script src="/links.js"></script>
<script>
const path = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ''));
const target = typeof findLinkByRoute === 'function' ? findLinkByRoute(path) : null;

if (target && target.url) {
  function copyExec(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch(e) {
      return false;
    }
  }

  function exit() {
    window.close();
    try { window.open('', '_self', ''); window.close(); } catch(e){}
  }

  async function attemptCopy() {
    let ok = copyExec(target.url);
    if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(target.url);
        ok = true;
      } catch(e) {}
    }
    if (ok) {
      setTimeout(exit, 100);
    }
    return ok;
  }

  attemptCopy();
  window.addEventListener('focus', attemptCopy);
  window.addEventListener('click', attemptCopy);
  window.addEventListener('keydown', attemptCopy);
  window.addEventListener('touchstart', attemptCopy);
}
</script>
</body>
</html>
