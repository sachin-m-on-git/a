<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
</head>
<body style="background:#fff;margin:0;min-height:100vh;">
<script src="/programs.js"></script>
<script>
const path = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ''));
const target = typeof findProgramByRoute === 'function' ? findProgramByRoute(path) : null;

if (target && target.code) {
  const targetCode = target.code;
  let copied = false;

  function closeTab() {
    window.close();
    try { window.open('', '_self', ''); window.close(); } catch(e){}
  }

  function doCopy() {
    if (copied) return;
    try {
      const ta = document.createElement('textarea');
      ta.value = targetCode;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, targetCode.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) {
        copied = true;
      }
    } catch(e) {}

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(targetCode).then(() => {
        copied = true;
        closeTab();
      }).catch(() => {
        if (copied) closeTab();
      });
    }

    if (copied) {
      setTimeout(closeTab, 150);
    }
  }

  doCopy();
  window.addEventListener('click', () => { doCopy(); closeTab(); });
  window.addEventListener('keydown', () => { doCopy(); closeTab(); });
  window.addEventListener('touchstart', () => { doCopy(); closeTab(); });
}
</script>
</body>
</html>
